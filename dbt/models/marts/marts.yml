version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: dim_customers
    columns:
      - name: customer_key
        tests: [unique, not_null]

  - name: dim_products
    columns:
      - name: product_key
        tests: [unique, not_null]

  - name: dim_sellers
    columns:
      - name: seller_key
        tests: [unique, not_null]

  - name: dim_payment_type
    columns:
      - name: payment_type_key
        tests: [unique, not_null]

  - name: dim_order_status
    columns:
      - name: order_status_key
        tests: [unique, not_null]

  - name: fact_orders
    columns:
      - name: order_key
        tests: [unique, not_null]
      - name: customer_key
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_key

  - name: fact_order_items
    columns:
      - name: order_item_key
        tests: [unique, not_null]
      - name: product_key
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_key
      - name: seller_key
        tests:
          - relationships:
              to: ref('dim_sellers')
              field: seller_key

  - name: fact_payments
    columns:
      - name: payment_key
        tests: [unique, not_null]

  - name: fact_reviews
    columns:
      - name: review_event_key
        tests: [unique, not_null]

  - name: fact_customer_orders
    columns:
      - name: order_key
        tests: [unique, not_null]

  - name: fact_ml_product_demand
    columns:
      - name: ml_sample_key
        tests: [unique, not_null]
      - name: product_key
        tests: [not_null]
      - name: is_bestseller_next_7d
        tests: [not_null]

  - name: fact_ml_order_success
    columns:
      - name: ml_sample_key
        tests: [unique, not_null]
      - name: order_key
        tests: [not_null]
      - name: is_successful_order
        tests: [not_null]

  - name: fact_ml_geo_demand
    columns:
      - name: ml_sample_key
        tests: [unique, not_null]
      - name: location_key
        tests: [not_null]
      - name: is_high_demand_area_next_7d
        tests: [not_null]

  - name: bi_superset_business_overview
    description: Daily KPI view for the top section of the Superset dashboard.
    columns:
      - name: metric_date_key
        tests: [unique, not_null]

  - name: bi_superset_product_bestseller
    description: Superset-ready view for product bestseller prediction visuals.
    columns:
      - name: ml_sample_key
        tests: [unique, not_null]
      - name: product_key
        tests: [not_null]

  - name: bi_superset_order_success
    description: Superset-ready view for order success prediction visuals.
    columns:
      - name: ml_sample_key
        tests: [unique, not_null]
      - name: order_key
        tests: [not_null]

  - name: bi_superset_geo_demand
    description: Superset-ready view for geo demand prediction visuals.
    columns:
      - name: ml_sample_key
        tests: [unique, not_null]
      - name: location_key
        tests: [not_null]
