version: 2

models:
  - name: as_of_date
    description: Control calendar used for future as-of analysis and PIT expansion.
    columns:
      - name: as_of_date_key
        tests:
          - unique
          - not_null
      - name: as_of_date
        tests:
          - unique
          - not_null

  - name: pit_order_snapshot
    description: Point-in-time order snapshot combining latest order state and customer context.
    columns:
      - name: order_hashkey
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - unique
          - not_null

  - name: bridge_order_line
    description: Order-item bridge enriched with customer, product, seller, and SLA metrics.
    columns:
      - name: order_product_seller_hashkey
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: seller_id
        tests:
          - not_null

  - name: bridge_order_payment
    description: Order-level payment summary with normalized payment behavior indicators.
    columns:
      - name: order_hashkey
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - unique
          - not_null

  - name: bridge_customer_order
    description: Customer summary built from current order, payment, and review behavior.
    columns:
      - name: customer_hashkey
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - unique
          - not_null
