version: 2

models:
  - name: as_of_date
    description: Control calendar used for future as-of analysis and PIT expansion.
    columns:
      - name: as_of_date_key
        tests:
          - unique
          - not_null
      - name: as_of_date
        tests:
          - unique
          - not_null

  - name: pit_order_snapshot
    description: Daily point-in-time order snapshot combining order state and customer context as of each calendar date.
    columns:
      - name: order_hashkey
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: as_of_date_key
        tests:
          - not_null
      - name: as_of_date
        tests:
          - not_null

  - name: bridge_order_current_snapshot
    description: Current order snapshot resolved from the latest available row in the PIT table.
    columns:
      - name: order_hashkey
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - unique
          - not_null

  - name: bridge_order_line
    description: Order-item bridge enriched with customer, product, seller, and SLA metrics.
    columns:
      - name: order_product_seller_hashkey
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: seller_id
        tests:
          - not_null

  - name: bridge_order_payment
    description: Order-level payment summary with normalized payment behavior indicators.
    columns:
      - name: order_hashkey
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - unique
          - not_null

  - name: bridge_customer_order
    description: Customer summary built from current order, payment, and review behavior.
    columns:
      - name: customer_hashkey
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: bridge_customer_identity
    description: Maps source customer identifiers to the analysis-friendly customer_unique_id.
    columns:
      - name: customer_hashkey
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        tests:
          - not_null

  - name: same_as_customer
    description: Canonical customer grouping keyed by customer_unique_id.
    columns:
      - name: customer_unique_id
        tests:
          - unique
          - not_null
      - name: canonical_customer_hashkey
        tests:
          - not_null

  - name: bridge_customer_profile
    description: Customer 360 profile aggregated at customer_unique_id level for BI and ML.
    columns:
      - name: customer_unique_id
        tests:
          - unique
          - not_null
      - name: customer_hashkey
        tests:
          - not_null

  - name: bridge_product_master
    description: Current product master enriched with translated category attributes.
    columns:
      - name: product_hashkey
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - unique
          - not_null

  - name: bridge_seller_master
    description: Current seller master with lightweight operational performance metrics.
    columns:
      - name: seller_hashkey
        tests:
          - unique
          - not_null
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: bridge_review_order
    description: Review entity aligned to order context and customer context.
    columns:
      - name: order_review_hashkey
        tests:
          - unique
          - not_null
      - name: order_hashkey
        tests:
          - not_null
      - name: review_hashkey
        tests:
          - not_null

  - name: bridge_order_lifecycle
    description: Order lifecycle base with business-friendly status and timing indicators.
    columns:
      - name: order_hashkey
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - unique
          - not_null

  - name: bridge_order_fulfillment
    description: Order-level fulfillment summary aggregated from line items.
    columns:
      - name: order_hashkey
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - unique
          - not_null

  - name: bridge_service_quality
    description: Order service-quality summary blending lifecycle, payment, and review signals.
    columns:
      - name: order_hashkey
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - unique
          - not_null
