services:

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_init
    entrypoint:
      - /bin/bash
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/ecommerce
      AIRFLOW__CORE__LOAD_EXAMPLES: "${AIRFLOW__CORE__LOAD_EXAMPLES}"
      AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW__WEBSERVER__SECRET_KEY}"
      PYTHONPATH: /opt/airflow
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce
      DB_USER: airflow
      DB_PASSWORD: airflow
      AIRFLOW_ADMIN_USERNAME: "${AIRFLOW_ADMIN_USERNAME}"
      AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD}"
      AIRFLOW_ADMIN_EMAIL: "${AIRFLOW_ADMIN_EMAIL}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data/raw:/opt/airflow/data/raw
      - ./dbt:/opt/airflow/dbt
      - ./sql_init:/opt/airflow/sql_init
    command:
      - -c
      - >
        airflow db migrate &&
        (airflow users create
        --username "$${AIRFLOW_ADMIN_USERNAME}"
        --password "$${AIRFLOW_ADMIN_PASSWORD}"
        --firstname Airflow
        --lastname Admin
        --role Admin
        --email "$${AIRFLOW_ADMIN_EMAIL}" || true)

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: ecommerce
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres


  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/ecommerce
      AIRFLOW__CORE__LOAD_EXAMPLES: "${AIRFLOW__CORE__LOAD_EXAMPLES}"
      AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW__WEBSERVER__SECRET_KEY}"
      PYTHONPATH: /opt/airflow
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce
      DB_USER: airflow
      DB_PASSWORD: airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data/raw:/opt/airflow/data/raw
      - ./dbt:/opt/airflow/dbt
      - ./sql_init:/opt/airflow/sql_init
    ports:
      - "8080:8080"
    command: webserver


  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/ecommerce
      AIRFLOW__CORE__LOAD_EXAMPLES: "${AIRFLOW__CORE__LOAD_EXAMPLES}"
      AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW__WEBSERVER__SECRET_KEY}"
      PYTHONPATH: /opt/airflow
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce
      DB_USER: airflow
      DB_PASSWORD: airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data/raw:/opt/airflow/data/raw
      - ./dbt:/opt/airflow/dbt
      - ./sql_init:/opt/airflow/sql_init
    command: scheduler


  streamlit:
    build:
      context: .
      dockerfile: streamlit/Dockerfile
    container_name: streamlit_app
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce
      DB_USER: airflow
      DB_PASSWORD: airflow
      SUPERSET_DASHBOARD_URL: "${SUPERSET_DASHBOARD_URL}"
      SUPERSET_PRODUCT_BESTSELLER_DASHBOARD_URL: "${SUPERSET_PRODUCT_BESTSELLER_DASHBOARD_URL}"
      SUPERSET_ORDER_SUCCESS_DASHBOARD_URL: "${SUPERSET_ORDER_SUCCESS_DASHBOARD_URL}"
      SUPERSET_GEO_DEMAND_DASHBOARD_URL: "${SUPERSET_GEO_DEMAND_DASHBOARD_URL}"
      PYTHONPATH: /app
    volumes:
      - ./streamlit:/app/streamlit
      - ./src:/app/src
    ports:
      - "8501:8501"


  superset:
    build:
      context: .
      dockerfile: superset/Dockerfile
    container_name: superset
    depends_on:
      - postgres
    environment:
      SUPERSET_SECRET_KEY: ecommerce_superset_secret_2026
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_ADMIN_USERNAME: admin
      SUPERSET_ADMIN_FIRSTNAME: Superset
      SUPERSET_ADMIN_LASTNAME: Admin
      SUPERSET_ADMIN_EMAIL: admin@superset.local
      SUPERSET_ADMIN_PASSWORD: admin
    volumes:
      - superset_home:/app/superset_home
    ports:
      - "8088:8088"
    command: >
      /bin/sh -c "
      superset db upgrade &&
      (superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@superset.local --password admin || true) &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088 --with-threads
      "


volumes:
  postgres_data:
  superset_home:
