services:

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: ecommerce
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres


  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_webserver
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/ecommerce
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: ecommerce_secret_2026
      PYTHONPATH: /opt/airflow
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce
      DB_USER: airflow
      DB_PASSWORD: airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data/raw:/opt/airflow/data/raw
      - ./dbt:/opt/airflow/dbt
      - ./sql_init:/opt/airflow/sql_init
    ports:
      - "8080:8080"
    command: webserver


  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_scheduler
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/ecommerce
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: ecommerce_secret_2026
      PYTHONPATH: /opt/airflow
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce
      DB_USER: airflow
      DB_PASSWORD: airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data/raw:/opt/airflow/data/raw
      - ./dbt:/opt/airflow/dbt
      - ./sql_init:/opt/airflow/sql_init
    command: scheduler


  streamlit:
    build:
      context: .
      dockerfile: streamlit_app/Dockerfile
    container_name: streamlit_app
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce
      DB_USER: airflow
      DB_PASSWORD: airflow
      SUPERSET_DASHBOARD_URL: http://localhost:8088/dashboard/list/
      PYTHONPATH: /app
    volumes:
      - ./streamlit_app:/app/streamlit_app
      - ./src:/app/src
    ports:
      - "8501:8501"


  superset:
    build:
      context: .
      dockerfile: superset/Dockerfile
    container_name: superset
    depends_on:
      - postgres
    environment:
      SUPERSET_SECRET_KEY: ecommerce_superset_secret_2026
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_ADMIN_USERNAME: admin
      SUPERSET_ADMIN_FIRSTNAME: Superset
      SUPERSET_ADMIN_LASTNAME: Admin
      SUPERSET_ADMIN_EMAIL: admin@superset.local
      SUPERSET_ADMIN_PASSWORD: admin
    volumes:
      - superset_home:/app/superset_home
    ports:
      - "8088:8088"
    command: >
      /bin/sh -c "
      superset db upgrade &&
      (superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@superset.local --password admin || true) &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088 --with-threads
      "


volumes:
  postgres_data:
  superset_home:
